<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule Percentage Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 20px;
            text-align: left;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Molecule Calculator</h2>
        <p>Enter a formula (e.g., H2O, C6H12O6):</p>
        <input type="text" id="formulaInput" placeholder="Enter chemical shortcut...">
        <button onclick="calculate()">Calculate %</button>

        <div id="resultBox" class="results"></div>
    </div>

    <script>
        // A simplified periodic table with atomic masses
        const atomicMasses = {
            'H': 1.008, 'He': 4.0026, 'Li': 6.94, 'Be': 9.0122, 'B': 10.81, 'C': 12.011,
            'N': 14.007, 'O': 15.999, 'F': 18.998, 'Ne': 20.180, 'Na': 22.990,
            'Mg': 24.305, 'Al': 26.982, 'Si': 28.085, 'P': 30.974, 'S': 32.06,
            'Cl': 35.45, 'K': 39.098, 'Ca': 40.078, 'Fe': 55.845, 'Cu': 63.546,
            'Zn': 65.38, 'Ag': 107.87, 'Au': 196.97
        };

        function calculate() {
            const formula = document.getElementById('formulaInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = ""; // Clear previous results

            if (!formula) {
                resultBox.innerHTML = "<p class='error'>Please enter a formula.</p>";
                return;
            }

            // Regular expression to match Element and Number (e.g., C6, H12, O)
            const regex = /([A-Z][a-z]*)(\d*)/g;
            let match;
            let totalMass = 0;
            const elementsInFormula = {};

            // Parse the formula
            while ((match = regex.exec(formula)) !== null) {
                let element = match[1];
                let count = match[2] ? parseInt(match[2]) : 1;

                if (!(element in atomicMasses)) {
                    resultBox.innerHTML = `<p class='error'>Error: Element '${element}' not found in our database.</p>`;
                    return;
                }

                elementsInFormula[element] = (elementsInFormula[element] || 0) + count;
                totalMass += atomicMasses[element] * count;
            }

            if (totalMass === 0) {
                resultBox.innerHTML = "<p class='error'>Invalid formula structure.</p>";
                return;
            }

            // Generate HTML output
            let outputHTML = `<h3>Results for ${formula}:</h3>`;
            outputHTML += `<p><strong>Total Mass:</strong> ${totalMass.toFixed(2)} g/mol</p><ul>`;

            for (const [element, count] of Object.entries(elementsInFormula)) {
                let elementMass = atomicMasses[element] * count;
                let percentage = (elementMass / totalMass) * 100;
                outputHTML += `<li><strong>${element}:</strong> ${percentage.toFixed(2)}%</li>`;
            }

            outputHTML += `</ul>`;
            resultBox.innerHTML = outputHTML;
        }
    </script>
</body>
</html>
